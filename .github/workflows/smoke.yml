name: Open every view in a browser

on:
  push:
    paths: ["site/**", "tools/smoke.py", "bin/orrery", ".github/workflows/smoke.yml"]
  pull_request:
    paths: ["site/**", "tools/smoke.py", "bin/orrery", ".github/workflows/smoke.yml"]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright and Chromium
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Open each view and fail on a page error
        env:
          ORRERY_NO_PULL: "1"
        # no screenshots here: the runner has no GPU, and the ray-traced black hole takes longer
        # than a screenshot may wait to draw one frame in software
        run: python3 tools/smoke.py
